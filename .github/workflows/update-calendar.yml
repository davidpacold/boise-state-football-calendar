name: Update Boise State football calendar

on:
  push:
    branches: [main]
    paths:
      - "generate_calendar.py"
      - "requirements.txt"
      - ".github/workflows/update-calendar.yml"
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python generate_calendar.py
      - name: Commit calendar changes
        run: |
          if git diff --quiet -- docs/boise-state-football.ics state.json; then
            echo "No schedule changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/boise-state-football.ics state.json
          git commit -m "Update Boise State football calendar"
          git pull --rebase origin main
          git push origin main
