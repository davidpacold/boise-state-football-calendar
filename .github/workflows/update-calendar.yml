name: Update Boise State football calendar

on:
  push:
    branches: [main]
    paths:
      - "generate_calendar.py"
      - "generate_with_odds.py"
      - "add_structured_locations.py"
      - "requirements.txt"
      - "docs/**"
      - ".github/workflows/update-calendar.yml"
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python generate_with_odds.py
      - run: python add_structured_locations.py
      - name: Commit calendar changes
        run: |
          if git diff --quiet -- docs/boise-state-football.ics state.json; then
            echo "No schedule changes."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/boise-state-football.ics state.json
            git commit -m "Update Boise State football calendar"
            git pull --rebase origin main
            git push origin main
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
