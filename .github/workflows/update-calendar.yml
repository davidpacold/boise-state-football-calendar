name: Update Boise State football calendar

on:
  push:
    branches: [main]
    paths:
      - "generate_calendar.py"
      - "generate_with_odds.py"
      - "add_structured_locations.py"
      - "requirements.txt"
      - "requirements-dev.txt"
      - "test_locations.py"
      - "test_alerts.py"
      - "test_results.py"
      - "game_day_check.py"
      - "docs/**"
      - ".github/workflows/update-calendar.yml"
      - ".github/workflows/game-day-results.yml"
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    concurrency:
      group: football-calendar-update
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m unittest discover -v
      - run: python generate_with_odds.py
      - run: python add_structured_locations.py
      - name: Commit calendar changes
        id: changes
        run: |
          if git diff --quiet -- docs/boise-state-football.ics state.json; then
            echo "No schedule changes."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/boise-state-football.ics state.json
            git commit -m "Update Boise State football calendar"
            git pull --rebase origin main
            git push origin main
          fi
      - name: Configure GitHub Pages
        if: steps.changes.outputs.publish == 'true' || github.event_name != 'schedule'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: steps.changes.outputs.publish == 'true' || github.event_name != 'schedule'
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Deploy GitHub Pages
        if: steps.changes.outputs.publish == 'true' || github.event_name != 'schedule'
        id: deployment
        uses: actions/deploy-pages@v4
